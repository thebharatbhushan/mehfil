<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mehfil — My Profile & Dashboard | Poetry Sanctuary</title>
  
  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700;800&family=Inter:opsz,wght@14..32,300;400;500;600;700&family=Tiro+Devanagari+Hindi&family=Noto+Serif+Devanagari:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #FEF9F2;
      color: #2C241F;
      font-family: 'Inter', 'Noto Serif Devanagari', serif;
      overflow-x: hidden;
      position: relative;
    }

    :root {
      --bg: #FEF9F2;
      --card-bg: rgba(255, 253, 248, 0.96);
      --accent: #C16A4B;
      --accent-soft: #E8C8BA;
      --accent-dark: #9E4F36;
      --text-dark: #2C241F;
      --text-muted: #756256;
      --border-light: rgba(200, 180, 160, 0.35);
      --shadow-sm: 0 20px 35px -12px rgba(0, 0, 0, 0.08);
      --shadow-hover: 0 30px 45px -18px rgba(0, 0, 0, 0.15);
      --gradient-gold: linear-gradient(135deg, #F3E7DA 0%, #F1E2D2 100%);
    }

    /* animated orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      z-index: -2;
      opacity: 0.5;
      animation: slowDrift 22s infinite alternate ease-in-out;
    }
    .orb-1 { width: 500px; height: 500px; background: #FFD7C2; top: -150px; left: -10%; }
    .orb-2 { width: 550px; height: 550px; background: #DDC7B0; bottom: -100px; right: -5%; animation-delay: -5s; }
    .orb-3 { width: 380px; height: 380px; background: #F7E1CF; top: 40%; left: 70%; animation-duration: 18s; }
    @keyframes slowDrift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -40px) scale(1.2); }
    }

    .scroll-indicator {
      position: fixed; top: 0; left: 0; height: 4px; background: var(--accent); width: 0%;
      z-index: 10000; transition: width 0.1s ease; border-radius: 0 2px 2px 0;
    }

    /* === MOBILE RESPONSIVE NAVIGATION (SAME AS INDEX) === */
    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(18px);
      background: rgba(254, 249, 242, 0.75);
      border-bottom: 1px solid var(--border-light);
      transition: all 0.3s ease;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0;
      width: min(1280px, 92%);
      margin: 0 auto;
    }

    .logo {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(120deg, #C16A4B, #A84C2E);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .nav-links a {
      text-decoration: none;
      font-weight: 500;
      color: var(--text-dark);
      transition: 0.2s;
      position: relative;
      font-size: 1rem;
    }

    .nav-links a::before {
      content: '';
      position: absolute;
      width: 0%;
      height: 2px;
      background: var(--accent);
      bottom: -6px;
      left: 0;
      transition: 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .nav-links a:hover::before {
      width: 100%;
    }

    .nav-btn {
      background: var(--accent);
      padding: 10px 26px;
      border-radius: 50px;
      color: white;
      font-weight: 600;
      transition: 0.3s;
      cursor: pointer;
      border: none;
      box-shadow: 0 5px 12px rgba(193, 106, 75, 0.2);
    }

    .nav-btn:hover {
      transform: translateY(-3px);
      background: #A84C2E;
      box-shadow: 0 12px 20px rgba(193, 106, 75, 0.3);
    }

    .menu-btn {
      display: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: var(--accent);
    }

    /* Mobile overlay + menu */
    .mobile-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      opacity: 0;
      visibility: hidden;
      transition: .35s;
      z-index: 998;
    }
    .mobile-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    @media (max-width: 680px) {
      .nav-links {
        display: none;
      }
      .menu-btn {
        display: block;
      }
      .nav-links.active {
        display: flex;
        position: fixed;
        top: 12px !important;
        right: 12px !important;
        width: calc(100% - 24px) !important;
        height: auto !important;
        padding: 28px !important;
        border-radius: 32px !important;
        background: linear-gradient(135deg, #fffdfb, #fff6f0) !important;
        border: 1px solid rgba(193, 106, 75, 0.15);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
        gap: 0 !important;
        overflow: hidden;
        flex-direction: column;
        z-index: 999;
      }
      .nav-links.active a {
        width: 100%;
        padding: 18px 16px;
        border-radius: 18px;
        font-size: 1.05rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(193, 106, 75, 0.04);
        margin: 6px 0;
      }
      .nav-links.active a:hover {
        background: #C16A4B;
        color: #fff;
        transform: translateX(4px);
      }
      .nav-links.active a::before {
        display: none;
      }
      .menu-btn {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: flex !important;
        align-items: center;
        justify-content: center;
        background: rgba(193, 106, 75, 0.08);
        border: 1px solid rgba(193, 106, 75, 0.15);
      }
      .nav-btn {
        padding: 12px 20px;
        font-size: .9rem;
      }
      .write-btn {
        width: 48px;
        height: 48px;
        padding: 0 !important;
        border-radius: 14px;
        justify-content: center;
        box-shadow: none;
        background: rgba(193, 106, 75, 0.08) !important;
        border: 1px solid rgba(193, 106, 75, 0.15);
        color: #C16A4B;
      }
      .write-btn span {
        display: none;
      }
      .write-btn i {
        font-size: 1.25rem;
        margin: 0;
      }
    }

    /* dashboard main layout */
    .dashboard-container {
      width: min(1300px, 94%);
      margin: 2rem auto 4rem;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 2rem;
    }

    /* Sidebar Profile Card */
    .profile-sidebar {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border-radius: 2rem;
      border: 1px solid var(--border-light);
      padding: 2rem 1.5rem;
      text-align: center;
      transition: all 0.3s;
      box-shadow: var(--shadow-sm);
      height: fit-content;
      position: sticky;
      top: 100px;
    }
    .avatar-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 1rem;
    }
    .profile-pic {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid white;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      transition: 0.3s;
    }
    .edit-avatar-icon {
      position: absolute;
      bottom: 5px; right: 5px;
      background: var(--accent);
      border-radius: 50%;
      width: 38px; height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      border: 2px solid white;
      transition: 0.2s;
    }
    .edit-avatar-icon:hover { background: #9E4F36; transform: scale(1.05);}
    .profile-name {
      font-size: 1.8rem;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
    }
    .profile-bio {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin: 0.5rem 0 1rem;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      background: rgba(193,106,75,0.08);
      padding: 0.8rem;
      border-radius: 1.2rem;
      margin: 1rem 0;
    }
    .stat-item { text-align: center; }
    .stat-number { font-weight: 800; font-size: 1.3rem; color: var(--accent-dark);}
    .stat-label { font-size: 0.7rem; color: var(--text-muted);}

    .edit-details-btn {
      background: transparent;
      border: 1px solid var(--border-light);
      width: 100%;
      padding: 12px;
      border-radius: 50px;
      font-weight: 500;
      margin: 1rem 0 0.5rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .edit-details-btn:hover { background: var(--accent); color: white; border-color: var(--accent);}

    /* Main content panels */
    .dashboard-main {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    .card-panel {
      background: var(--card-bg);
      backdrop-filter: blur(5px);
      border-radius: 2rem;
      border: 1px solid var(--border-light);
      padding: 1.8rem 2rem;
      transition: 0.25s;
      box-shadow: var(--shadow-sm);
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .panel-header h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-weight: 700;
    }
    .action-btns {
      display: flex;
      gap: 12px;
    }
    .btn-icon {
      background: rgba(193,106,75,0.1);
      border: none;
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-icon i { margin-right: 6px; }
    .btn-icon:hover { background: var(--accent); color: white; transform: translateY(-2px);}
    .btn-danger { background: rgba(220, 70, 50, 0.12); color: #B94A36; }
    .btn-danger:hover { background: #B94A36; color: white;}

    /* poems list */
    .poem-item {
      background: rgba(255,255,245,0.7);
      border-radius: 1.2rem;
      padding: 1rem 1.2rem;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      transition: 0.2s;
      border: 1px solid var(--border-light);
    }
    .poem-item:hover { transform: translateX(6px); background: white;}
    .poem-info h4 { font-size: 1.2rem; margin-bottom: 0.2rem; }
    .poem-meta { font-size: 0.7rem; color: var(--text-muted);}
    .poem-actions-group { display: flex; gap: 12px;}
    .poem-action {
      cursor: pointer;
      background: none;
      border: none;
      font-size: 1rem;
      transition: 0.2s;
      padding: 6px 10px;
      border-radius: 50px;
    }
    .poem-action.show { color: var(--accent);}
    .poem-action.hide { color: #bfaa97;}
    .poem-action.delete { color: #c0715a;}
    .poem-action:hover { background: rgba(193,106,75,0.1); transform: scale(1.05);}
    .hidden-poem { opacity: 0.6; background: #f6efe8; filter: grayscale(0.05);}

    /* password change & delete account */
    .settings-group {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 0.6rem 0;
      border-bottom: 1px dashed var(--border-light);
    }
    .setting-row span { font-weight: 500; }
    .small-btn {
      background: none;
      border: 1px solid var(--border-light);
      padding: 8px 18px;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.2s;
    }
    .small-btn:hover { background: var(--accent); color: white; border-color: var(--accent);}
    .del-account-btn { background: rgba(200, 70, 50, 0.1); border-color: #e2b3a5; color: #b9442c; }
    .del-account-btn:hover { background: #b9442c; color: white;}

    /* modals */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
      z-index: 2000; display: flex; align-items: center; justify-content: center;
      visibility: hidden; opacity: 0; transition: 0.25s;
    }
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .modal-card {
      background: #FFFCF7;
      border-radius: 2rem;
      max-width: 500px;
      width: 90%;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 40px 70px rgba(0,0,0,0.2);
      transform: scale(0.95);
      transition: 0.2s;
    }
    .modal-overlay.active .modal-card { transform: scale(1);}
    .modal-card input, .modal-card textarea {
      width: 100%;
      padding: 12px;
      margin: 1rem 0;
      border-radius: 1rem;
      border: 1px solid var(--border-light);
      background: white;
    }
    .modal-buttons { display: flex; gap: 1rem; justify-content: center; margin-top: 1rem;}

    @media (max-width: 880px) {
      .dashboard-container { grid-template-columns: 1fr; }
      .profile-sidebar { position: relative; top: 0; }
      .panel-header { flex-direction: column; align-items: start; gap: 12px;}
    }
    .fade-up { opacity: 0; transform: translateY(30px); transition: 0.7s ease; }
    .fade-up.visible { opacity: 1; transform: translateY(0); }
    .toast-msg {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: #2C241F; color: #f1e2d2; padding: 12px 28px; border-radius: 60px;
      z-index: 3000; transition: 0.3s; font-size: 0.85rem;
      backdrop-filter: blur(8px); white-space: nowrap; pointer-events: none;
    }
    @media (max-width: 480px) {
      .toast-msg { white-space: normal; text-align: center; width: 90%; font-size: 0.75rem; }
      .poem-item { flex-direction: column; align-items: flex-start; gap: 12px;}
    }
  </style>
</head>
<body>
<div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
<div class="scroll-indicator" id="scrollBar"></div>
<div class="mobile-overlay" id="mobileOverlay"></div>

<nav>
  <div class="nav-inner">
    <div class="logo"><i class="fas fa-feather-alt"></i> मेहफ़िल</div>
    <div class="nav-links" id="navLinks">
      <a href="./index.html">मुखपृष्ठ</a>
      <a href="./poems.html">कविताएँ</a>
      <a href="./poets.html">रचनाकार</a>
      <a href="./dashboard.html" id="dashboardLink">डैशबोर्ड</a>
      <button class="nav-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> लॉगआउट</button>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="nav-btn write-btn" onclick="window.location.href='./publish.html'">
        <i class="fas fa-pen-fancy"></i>
        <span>लेखन प्रारम्भ करें</span>
      </button>
      <div class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></div>
    </div>
  </div>
</nav>

<div class="dashboard-container">
  <!-- LEFT: Profile Sidebar -->
  <aside class="profile-sidebar fade-up">
    <div class="avatar-wrapper">
      <img class="profile-pic" id="profileImg" src="https://randomuser.me/api/portraits/women/68.jpg" alt="profile">
      <div class="edit-avatar-icon" id="editAvatarBtn"><i class="fas fa-camera"></i></div>
    </div>
    <h2 class="profile-name" id="displayName">रिया शर्मा</h2>
    <div class="profile-bio" id="displayBio">हर लफ्ज़ में जादू भरती हूँ ✨ | शायरा</div>
    <div class="stat-row">
      <div class="stat-item"><div class="stat-number" id="poemCountStat">8</div><div class="stat-label">रचनाएँ</div></div>
      <div class="stat-item"><div class="stat-number">1.2k</div><div class="stat-label">अनुयायी</div></div>
      <div class="stat-item"><div class="stat-number">245</div><div class="stat-label">लाइक्स</div></div>
    </div>
    <button class="edit-details-btn" id="openEditProfileBtn"><i class="fas fa-user-edit"></i> प्रोफ़ाइल संपादित करें</button>
  </aside>

  <!-- RIGHT: Dashboard panels -->
  <div class="dashboard-main">
    <!-- poems management -->
    <div class="card-panel fade-up">
      <div class="panel-header">
        <h2><i class="fas fa-book-open"></i> मेरी रचनाएँ</h2>
        <div class="action-btns">
          <button class="btn-icon" id="newPoemBtn"><i class="fas fa-plus"></i> नई कविता</button>
        </div>
      </div>
      <div id="poemsListContainer">
        <!-- dynamic poems will appear -->
      </div>
    </div>

    <!-- Account & security -->
    <div class="card-panel fade-up">
      <div class="panel-header">
        <h2><i class="fas fa-lock"></i> खाता सेटिंग्स</h2>
      </div>
      <div class="settings-group">
        <div class="setting-row">
          <span><i class="fas fa-key"></i> पासवर्ड बदलें</span>
          <button class="small-btn" id="changePasswordBtn">बदलें</button>
        </div>
        <div class="setting-row">
          <span><i class="fas fa-trash-alt"></i> खाता हटाएँ (स्थायी)</span>
          <button class="small-btn del-account-btn" id="deleteAccountBtn">हटाएँ</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- EDIT PROFILE MODAL -->
<div id="editProfileModal" class="modal-overlay">
  <div class="modal-card">
    <h3><i class="fas fa-user-edit"></i> प्रोफ़ाइल संपादित करें</h3>
    <input type="text" id="editNameInput" placeholder="नाम">
    <textarea id="editBioInput" rows="2" placeholder="जीवन परिचय / Bio"></textarea>
    <div class="modal-buttons">
      <button class="small-btn" id="saveProfileBtn">सहेजें</button>
      <button class="small-btn" id="closeProfileModal">रद्द करें</button>
    </div>
  </div>
</div>

<!-- CHANGE PASSWORD MODAL -->
<div id="passwordModal" class="modal-overlay">
  <div class="modal-card">
    <h3><i class="fas fa-lock"></i> नया पासवर्ड सेट करें</h3>
    <input type="password" id="newPass" placeholder="नया पासवर्ड" autocomplete="off">
    <input type="password" id="confirmPass" placeholder="पुष्टि करें">
    <div class="modal-buttons">
      <button class="small-btn" id="confirmPasswordBtn">बदलें</button>
      <button class="small-btn" id="closePasswordModal">रद्द करें</button>
    </div>
  </div>
</div>

<!-- TOAST NOTIFICATION -->
<div id="toastMsg" class="toast-msg">✨</div>

<script>
  // --- MOBILE MENU TOGGLE (SAME AS INDEX PAGE) ---
  const menuBtn = document.getElementById("menuBtn");
  const navLinks = document.getElementById("navLinks");
  const mobileOverlay = document.getElementById("mobileOverlay");
  
  if(menuBtn && navLinks && mobileOverlay) {
    menuBtn.addEventListener("click", () => {
      navLinks.classList.toggle("active");
      mobileOverlay.classList.toggle("active");
      menuBtn.innerHTML = navLinks.classList.contains("active") ? '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
    });
    mobileOverlay.addEventListener("click", () => {
      navLinks.classList.remove("active");
      mobileOverlay.classList.remove("active");
      if(menuBtn) menuBtn.innerHTML = '<i class="fas fa-bars"></i>';
    });
  }

  // --- STATE MANAGEMENT ---
  let poems = [
    { id: 1, title: "तुम्हारी याद", content: "तुम्हारी याद किसी खुशबू की तरह है...", visible: true, date: "2 दिन पहले" },
    { id: 2, title: "ख़ामोशी", content: "कुछ दर्द आवाज़ नहीं करते...", visible: true, date: "5 दिन पहले" },
    { id: 3, title: "बारिश की बूंदें", content: "बारिश की बूंदों में तेरी हँसी...", visible: false, date: "1 सप्ताह पहले" },
    { id: 4, title: "सफ़र", content: "रास्ते मंज़िल से ज़्यादा ख़ुद से मिलाते हैं...", visible: true, date: "3 दिन पहले" }
  ];
  
  let currentUser = {
    name: "रिया शर्मा",
    bio: "हर लफ्ज़ में जादू भरती हूँ ✨ | शायरा",
    avatar: "https://randomuser.me/api/portraits/women/68.jpg"
  };

  function saveToLocal() {
    localStorage.setItem("mehfil_poems", JSON.stringify(poems));
    localStorage.setItem("mehfil_user", JSON.stringify(currentUser));
  }

  function loadFromLocal() {
    const storedPoems = localStorage.getItem("mehfil_poems");
    const storedUser = localStorage.getItem("mehfil_user");
    if(storedPoems) poems = JSON.parse(storedPoems);
    if(storedUser) currentUser = JSON.parse(storedUser);
    renderPoems();
    updateProfileUI();
    updatePoemStat();
  }

  function updatePoemStat() {
    const visibleCount = poems.filter(p => p.visible).length;
    const statElem = document.getElementById("poemCountStat");
    if(statElem) statElem.innerText = visibleCount;
  }

  function updateProfileUI() {
    document.getElementById("displayName").innerText = currentUser.name;
    document.getElementById("displayBio").innerText = currentUser.bio;
    document.getElementById("profileImg").src = currentUser.avatar;
  }

  function renderPoems() {
    const container = document.getElementById("poemsListContainer");
    if(!container) return;
    if(poems.length === 0) {
      container.innerHTML = `<div style="text-align:center;padding:2rem;color:var(--text-muted);"><i class="fas fa-feather-alt"></i> अभी कोई रचना नहीं, पहली कविता जोड़ें!</div>`;
      return;
    }
    container.innerHTML = poems.map(poem => `
      <div class="poem-item ${!poem.visible ? 'hidden-poem' : ''}" data-id="${poem.id}">
        <div class="poem-info">
          <h4>${escapeHtml(poem.title)}</h4>
          <div class="poem-meta"><i class="far fa-calendar-alt"></i> ${poem.date} • ${poem.visible ? 'दृश्यमान' : 'छिपाई गई'}</div>
        </div>
        <div class="poem-actions-group">
          <button class="poem-action show" data-action="toggle" data-id="${poem.id}" title="${poem.visible ? 'छिपाएँ' : 'दिखाएँ'}">
            <i class="fas ${poem.visible ? 'fa-eye-slash' : 'fa-eye'}"></i>
          </button>
          <button class="poem-action delete" data-action="delete" data-id="${poem.id}" title="हटाएँ">
            <i class="fas fa-trash-alt"></i>
          </button>
        </div>
      </div>
    `).join("");
    
    document.querySelectorAll('.poem-action[data-action="toggle"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = parseInt(btn.dataset.id);
        togglePoemVisibility(id);
      });
    });
    document.querySelectorAll('.poem-action[data-action="delete"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = parseInt(btn.dataset.id);
        deletePoemById(id);
      });
    });
  }

  function togglePoemVisibility(id) {
    const poem = poems.find(p => p.id === id);
    if(poem) {
      poem.visible = !poem.visible;
      renderPoems();
      updatePoemStat();
      saveToLocal();
      showToast(poem.visible ? "✨ कविता अब दिख रही है" : "🌙 कविता छिपा दी गई");
    }
  }

  function deletePoemById(id) {
    if(confirm("क्या आप इस कविता को स्थायी रूप से हटाना चाहते हैं?")) {
      poems = poems.filter(p => p.id !== id);
      renderPoems();
      updatePoemStat();
      saveToLocal();
      showToast("🖋️ रचना हटा दी गई");
    }
  }

  function addNewPoem(title, content) {
    const newId = Date.now();
    poems.unshift({
      id: newId,
      title: title,
      content: content,
      visible: true,
      date: "आज"
    });
    renderPoems();
    updatePoemStat();
    saveToLocal();
    showToast("❤️ नई कविता प्रकाशित हुई!");
  }

  function escapeHtml(str) { 
    if(!str) return '';
    return str.replace(/[&<>]/g, function(m){
      if(m === '&') return '&amp;';
      if(m === '<') return '&lt;';
      if(m === '>') return '&gt;';
      return m;
    });
  }

  function showToast(message, isError = false) {
    const toast = document.getElementById("toastMsg");
    if(!toast) return;
    toast.innerText = message;
    toast.style.background = isError ? "#B94A36" : "#2C241F";
    toast.style.transform = "translateX(-50%) translateY(0px)";
    setTimeout(() => {
      toast.style.transform = "translateX(-50%) translateY(100px)";
    }, 2500);
  }

  // MODALS
  const editProfileModal = document.getElementById("editProfileModal");
  const passwordModal = document.getElementById("passwordModal");
  function openModal(modal) { if(modal) modal.classList.add("active"); }
  function closeModal(modal) { if(modal) modal.classList.remove("active"); }

  document.getElementById("openEditProfileBtn")?.addEventListener("click", () => {
    document.getElementById("editNameInput").value = currentUser.name;
    document.getElementById("editBioInput").value = currentUser.bio;
    openModal(editProfileModal);
  });
  document.getElementById("saveProfileBtn")?.addEventListener("click", () => {
    const newName = document.getElementById("editNameInput").value.trim();
    const newBio = document.getElementById("editBioInput").value.trim();
    if(newName) currentUser.name = newName;
    currentUser.bio = newBio || "एक कवि की दास्ताँ...";
    updateProfileUI();
    saveToLocal();
    closeModal(editProfileModal);
    showToast("प्रोफ़ाइल अपडेट हो गई 🎉");
  });
  document.getElementById("closeProfileModal")?.addEventListener("click", () => closeModal(editProfileModal));
  
  document.getElementById("editAvatarBtn")?.addEventListener("click", () => {
    let imgUrl = prompt("प्रोफ़ाइल छवि URL डालें (या रैंडम के लिए cancel)", currentUser.avatar);
    if(imgUrl && imgUrl.trim() !== "") {
      currentUser.avatar = imgUrl.trim();
      updateProfileUI();
      saveToLocal();
      showToast("प्रोफ़ाइल तस्वीर बदल दी गई");
    } else if(imgUrl === null) {
      const randomAvatar = `https://randomuser.me/api/portraits/women/${Math.floor(Math.random()*100)}.jpg`;
      currentUser.avatar = randomAvatar;
      updateProfileUI();
      saveToLocal();
      showToast("नई रैंडम प्रोफ़ाइल तस्वीर सेट की");
    }
  });

  document.getElementById("changePasswordBtn")?.addEventListener("click", () => openModal(passwordModal));
  document.getElementById("confirmPasswordBtn")?.addEventListener("click", () => {
    const newPass = document.getElementById("newPass").value;
    const confirmPass = document.getElementById("confirmPass").value;
    if(!newPass || newPass.length < 4) { showToast("पासवर्ड कम से कम 4 अक्षर का हो", true); return; }
    if(newPass !== confirmPass) { showToast("पासवर्ड मेल नहीं खाते", true); return; }
    showToast("🔒 पासवर्ड सफलतापूर्वक बदल दिया गया");
    closeModal(passwordModal);
    document.getElementById("newPass").value = "";
    document.getElementById("confirmPass").value = "";
  });
  document.getElementById("closePasswordModal")?.addEventListener("click", () => closeModal(passwordModal));

  document.getElementById("deleteAccountBtn")?.addEventListener("click", () => {
    if(confirm("⚠️ क्या आप वाकई अपना खाता स्थायी रूप से हटाना चाहते हैं? सारी रचनाएँ मिट जाएंगी।")) {
      poems = [];
      currentUser = { name: "अतिथि", bio: "कविता प्रेमी", avatar: "https://randomuser.me/api/portraits/lego/1.jpg" };
      saveToLocal();
      updateProfileUI();
      renderPoems();
      updatePoemStat();
      showToast("खाता हटा दिया गया।");
    }
  });

  document.getElementById("newPoemBtn")?.addEventListener("click", () => {
    let title = prompt("कविता का शीर्षक लिखें:");
    if(!title) return;
    let content = prompt("कविता की पहली कुछ पंक्तियाँ लिखें (सार):");
    if(!content) content = "हर लफ्ज़ दिल से निकला...";
    addNewPoem(title, content);
  });

  document.getElementById("logoutBtn")?.addEventListener("click", () => {
    showToast("आप लॉग आउट हो गए। फिर मिलेंगे महफ़िल में!");
    setTimeout(() => { window.location.href = "index.html"; }, 1000);
  });
  document.getElementById("dashboardLink")?.addEventListener("click", (e) => { e.preventDefault(); window.scrollTo({top:0,behavior:'smooth'}); });

  const fadeEls = document.querySelectorAll('.fade-up');
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if(e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
  }, { threshold: 0.1 });
  fadeEls.forEach(el => obs.observe(el));

  window.addEventListener("scroll", () => {
    const winScroll = document.documentElement.scrollTop;
    const height = document.documentElement.scrollHeight - window.innerHeight;
    const scrolled = (winScroll / height) * 100;
    const scrollBar = document.getElementById("scrollBar");
    if(scrollBar) scrollBar.style.width = scrolled + "%";
  });

  loadFromLocal();
</script>
</body>
</html>
